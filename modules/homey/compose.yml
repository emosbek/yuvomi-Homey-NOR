# Yuvomi plus the Homey gateway, for a machine on the same network as Homey.
# Paths are relative to this file. The browser uses port 3000 on the host
# (Homey gateway, network_mode: host). Yuvomi is published only as
# 127.0.0.1:3001->3000 so the gateway can reach it without stealing :3000.
#
# Do not start the repo-root docker-compose.yml on this Pi while Homey is
# running: that file maps ${OIKOS_HTTP_PORT:-3000}:3000 and will fight Homey
# for port 3000. Keep OIKOS_HTTP_PORT=3001 in ../../.env as documentation of
# the host port even though this file pins the publish mapping below.
#
# Recipe mirrors (Tandoor/Mealie) on the same Pi:
# - Set RECIPE_PROVIDER_ALLOW_PRIVATE_NETWORK=true in ../../.env
# - Do NOT use http://127.0.0.1:8085 as the base URL inside Yuvomi: that is
#   the container's own loopback, not the host. Prefer the Pi LAN IP with
#   Tandoor published on 0.0.0.0 (not only 127.0.0.1), or join Tandoor's
#   Docker network and use its service hostname.
# - host.docker.internal points at the host gateway; it only helps when the
#   other service listens on an interface the bridge can reach.

name: yuvomi

services:
  yuvomi:
    image: ghcr.io/ulsklyc/yuvomi:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      MODULES_DIR: /app/modules
      SESSION_SECURE: "false"
      TRUST_PROXY: loopback
      # RECIPE_PROVIDER_ALLOW_PRIVATE_NETWORK comes from ../../.env via env_file.
      # Do not pin it here: Compose substitutes ${...} from the compose file's
      # directory, not from ../../.env, and would overwrite a true from env_file
      # with the default false.
    volumes:
      - ../../data:/data
      - ../../backups:/backups
      - ../../modules:/app/modules
      - ../../documents:/documents
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  homey:
    image: node:22-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      yuvomi:
        condition: service_healthy
    environment:
      HOMEY_GATEWAY_PORT: "3000"
      HOMEY_BIND: "0.0.0.0"
      YUVOMI_UPSTREAM: http://127.0.0.1:3001
      YUVOMI_INTERNAL_URL: http://127.0.0.1:3001
      HOMEY_DATA_DIR: /opt/yuvomi/data/homey
    volumes:
      - ../..:/opt/yuvomi:ro
      - ../../data/homey:/opt/yuvomi/data/homey
    working_dir: /opt/yuvomi
    command: ["node", "modules/homey/gateway.js"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
